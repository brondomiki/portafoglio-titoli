name: App Android Auto

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila l'APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepara il file
        run: cp app/build/outputs/apk/release/app-release.apk portafoglio-auto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: portafoglio-auto
          path: android/portafoglio-auto.apk

      - name: Pubblica come Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Portafoglio Auto 1.0.${{ github.run_number }}
          make_latest: true
          files: android/portafoglio-auto.apk
          body: |
            App per Android Auto. Scarica **portafoglio-auto.apk** dal telefono e installala.
            Istruzioni complete nell'app e nella web app (menu account → Collega Android Auto).
